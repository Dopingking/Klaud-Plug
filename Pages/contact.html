  <style>
    
.nav-link-custom {
  color: #e5e7eb !important;
  font-weight: 500;
  transition: color 0.3s ease;
}

.nav-link-custom:hover {
  color: #f97316 !important;
}

.text-orange {
  color: #f97316;
}

.carousel-item img {
  height: 400px; 
  object-fit: cover; 
  width: 100%;
}

 .carousel-caption.glass {
    background: rgba(255, 255, 255, 0.313);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 10px;
    padding: 1.5rem;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  .carousel-caption.glass h5,
  .carousel-caption.glass p {
    color: #fff;
    text-shadow: 0 0 5px rgba(0, 0, 0, 0.6);
  }

   .service-card {
            transition: transform 0.3s;
            height: 100%;
            background-color: #1e1e2f !important;
            color: #fff;
        }
        .service-card:hover {
            transform: translateY(-5px);
        }
        .service-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #f97316;
        }
    
          .testimonial-card {
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s;
            border: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .testimonial-card:hover {
            cursor: pointer;
        }
        .testimonial-header {
            background:#1e1e2f;
            color: white;
            padding: 20px;
        }
        .testimonial-body {
            padding: 25px;
            position: relative;
        }
        .testimonial-body:before {
            content: "\201C";
            font-family: Georgia;
            font-size: 80px;
            color: rgba(13, 110, 253, 0.1);
            position: absolute;
            top: 10px;
            left: 10px;
            line-height: 1;
        }
        .testimonial-text {
            font-size: 1.1rem;
            font-style: italic;
            position: relative;
            z-index: 1;
        }
        .testimonial-author {
            font-weight: bold;
            margin-top: 20px;
        }
        .testimonial-rating {
            color: #ffc107;
            margin-bottom: 10px;
        }
        .testimonial-image {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid white;
            object-fit: cover;
            margin-top: -15px;
            background: #f97316;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .section-title {
            position: relative;
            margin-bottom: 50px;
        }
        .section-title:after {
            content: "";
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: #1e1e2f;
        }
    
  </style>
